# --- Banco Postgres ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Console do H2 desabilitado (nem faz sentido, mas fica explicito) ---
spring.h2.console.enabled=false

# --- JPA/Hibernate ---
# update: Hibernate cria/atualiza automaticamente as tabelas com base nas entidades.
# Sem Flyway/Liquibase no projeto, essa e a estrategia escolhida por enquanto.
# Atencao: "update" nunca remove colunas/tabelas antigas, apenas adiciona o que falta.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.sql.init.mode=never