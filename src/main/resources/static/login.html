<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Entrar — Almoxarifado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="login-screen">
    <div class="card" style="width:100%;max-width:340px;">
        <div style="text-align:center;font-weight:600;margin-bottom:4px;">mtéc — Almoxarifado</div>
        <div class="hint" style="text-align:center;margin-bottom:16px;">Entre com seu usuário</div>
        <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
        <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"></div>
        <div id="login-error" class="hint" style="color:var(--red);display:none;margin-bottom:8px;"></div>
        <button class="btn btn-primary" style="width:100%;" onclick="fazerLogin()">Entrar</button>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
