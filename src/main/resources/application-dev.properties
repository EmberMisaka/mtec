# --- Banco H2 em memoria ---
spring.datasource.url=jdbc:h2:mem:mtec
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console web do H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA/Hibernate ---
# create-drop: recria o schema toda vez que a aplicacao sobe/desce.
# Faz sentido em dev porque o H2 em memoria perde os dados no restart de qualquer forma.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Dados iniciais (data.sql) ---
spring.sql.init.mode=always